[functions.marketaux-fetch]
# MISSION 6.1A.1: verify_jwt re-enabled. compute-sentiment now calls
# Marketaux directly (using MARKETAUX_API_TOKEN), so this wrapper is no
# longer on the sentiment hot path. Locking it back behind JWT ensures
# arbitrary anonymous callers cannot hit our Marketaux quota.
verify_jwt = true

# compute-* modules are stateless internal compute layers called by the
# generate-stock-analysis orchestrator (and other server-side callers) using
# the service-role key. They take only a stock symbol as input and contain
# no user-specific logic, so verify_jwt is intentionally disabled here.
# User-facing access is gated by the orchestrator, which keeps verify_jwt=true.
[functions.compute-technicals]
verify_jwt = false

