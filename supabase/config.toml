# MISSION 6.1A: verify_jwt disabled. The internal sibling-edge-fn call from
# compute-sentiment was rejected with UNAUTHORIZED_INVALID_JWT_FORMAT for
# both anon and service-role env keys, silently poisoning sentiment cache
# rows with empty article arrays. Wrapper is still gated by the upstream
# MARKETAUX_API_TOKEN secret; no public-write surface is exposed.
